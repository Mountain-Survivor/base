services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: predictions
      DB_USER: mlops
      DB_PASSWORD: $(DB_PASSWORD)
    depends_on:
      - db
    
  cache:
    image: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: $(DB_PASSWORD)
      POSTGRES_DB: predictions
    ports:
    - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data:
